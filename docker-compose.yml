services:
  max2tg:
    image: ghcr.io/type-rro/max2tg:latest
    container_name: max2tg
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_DIR=/app/logs
      - DATA_DIR=/app/data
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
