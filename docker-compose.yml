version: '3.5'

services:
  max2tg:
    build: .
    image: ghcr.io/type-rro/max2tg:latest
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs
      - ./topics.json:/app/topics.json
      - ./seen_messages.json:/app/seen_messages.json
      - ./messages_map.json:/app/messages_map.json
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
